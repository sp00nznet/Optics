# Build, self-test and conformance on every push and PR; a v* tag also publishes
# a GitHub Release with both executables attached.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No -G: whatever Visual Studio the runner image ships. /W4 /WX is the lint.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Self-test
        run: .\build\bin\optics-check.exe --selftest

      # Fails on any regression against tests/expected.tsv (docs/conformance.md).
      - name: Conformance
        run: .\build\bin\optics-check.exe --check sample-models tests/expected.tsv

      # Software GL into a DIB: proves the renderer runs with no display.
      - name: Headless render
        run: .\build\bin\optics-check.exe --render sample-models/Textured/crate.fbx build/crate.png 640x480

      - uses: actions/upload-artifact@v5
        with:
          name: optics-windows-x64
          path: |
            build/bin/Optics.exe
            build/bin/optics-check.exe
            build/crate.png

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/Optics.exe
            build/bin/optics-check.exe
          body_path: CHANGELOG.md
